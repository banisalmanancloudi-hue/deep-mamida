name: NurMotivasi Premium — Live Pages
on:
  push:
    branches: [main]
    paths:
      - 'nurmotivasi-premium/**'
      - '.github/workflows/nurmotivasi-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate files
        run: |
          test -f nurmotivasi-premium/index.html
          test -f nurmotivasi-premium/styles.css
          test -f nurmotivasi-premium/app.js
          node --check nurmotivasi-premium/app.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './nurmotivasi-premium'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
