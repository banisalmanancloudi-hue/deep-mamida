name: NurMotivasi Premium — Live Pages
on:
  push:
    branches: [main]
    paths:
      - 'nurmotivasi-premium/**'
      - '.github/workflows/nurmotivasi-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate files
        run: |
          test -f nurmotivasi-premium/index.html
          test -f nurmotivasi-premium/styles.css
          test -f nurmotivasi-premium/app.js
          node --check nurmotivasi-premium/app.js
      - name: Pollinations image API smoke test
        if: env.POLLINATIONS_API_KEY != ''
        run: |
          node <<'NODE'
          const key = process.env.POLLINATIONS_API_KEY;
          const response = await fetch('https://gen.pollinations.ai/v1/images/generations', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${key}`
            },
            body: JSON.stringify({
              model: 'google/gemini-3.1-flash-image',
              prompt: 'Create a simple abstract dark green premium background, no text.',
              size: '1024x1024',
              response_format: 'b64_json',
              n: 1
            })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data?.error?.message || 'Pollinations image API request failed');
          const imageData = data?.data?.[0]?.b64_json;
          if (!imageData) throw new Error('Pollinations returned no base64 image data');
          console.log('Pollinations image generation smoke test: OK');
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './nurmotivasi-premium'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
