name: NurMotivasi Premium — Live Pages
on:
  push:
    branches: [main]
    paths:
      - 'nurmotivasi-premium/**'
      - '.github/workflows/nurmotivasi-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate files
        run: |
          test -f nurmotivasi-premium/index.html
          test -f nurmotivasi-premium/styles.css
          test -f nurmotivasi-premium/app.js
          node --check nurmotivasi-premium/app.js
      - name: Gemini image API smoke test
        if: env.GEMINI_API_KEY != ''
        run: |
          node <<'NODE'
          const key = process.env.GEMINI_API_KEY;
          const response = await fetch('https://generativelanguage.googleapis.com/v1beta/interactions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
            body: JSON.stringify({
              model: 'gemini-3.1-flash-image',
              input: [{ type: 'text', text: 'Create a simple abstract dark green premium background, no text.' }],
              response_format: [{ type: 'image', mime_type: 'image/png', aspect_ratio: '1:1', image_size: '1K' }]
            })
          });
          const data = await response.json();
          if (!response.ok) throw new Error((data.error && data.error.message) || 'Gemini API request failed');
          if (!(data.output_image && data.output_image.data)) throw new Error('Gemini returned no image data');
          console.log('Gemini image generation smoke test: OK');
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './nurmotivasi-premium'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
